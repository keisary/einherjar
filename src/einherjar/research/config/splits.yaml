# splits.yaml — Jeux temporels train/val/holdout (ONTOLOGY.md S-3.1)
# Splits temporellement ordonnés, disjoints, verrouillés.
# Les bornes sont définies par actif et par timeframe (le temps est relatif à chaque série).

# --- Répartition par défaut ---
# train (60%) → val (20%) → holdout (20%)
ratios:
  train: 0.60
  val: 0.20
  holdout: 0.20

# --- Purging ---
# On exclut les bougies dont le label d'amplitude déborde sur le jeu suivant.
# Pour amplitude.unité = prix_absolu avec N bougies d'horizon, on purge N bougies
# après chaque split côté jeu suivant. Pareil val→holdout.
purging:
  enabled: true
  # La purge exacte = horizon N de l'amplitude (calculé par hypothèse)
  # voir engine/evaluator.py pour le calcul runtime

# --- Embargo ---
# On exclut en outre N bougies supplémentaires après chaque frontière de split,
# comme marge contre les micro-fuites de features (rolling mean, etc.)
embargo:
  enabled: true
  bougies: 1                   # défaut : 1 bougie

# --- Verrouillage ---
# Une fois les bornes fixées, elles sont GELÉES pour toute la durée de dev.
# Tout re-run utilise les mêmes bornes (hash dans data_version).
locking:
  holdout_is_sacred: true      # jamais touché pendant le dev
  one_shot_holdout: true       # exactement 1 passe par Einher final
  log_holdout_access: true     # tout accès au holdout est tracé

# --- Mode de split ---
# "ratio"  : fractions ci-dessus appliquées à chaque série
# "fixed_dates" : bornes explicites par actif (override)
mode: ratio

# --- Bornes explicites (si mode = "fixed_dates") ---
# Exemple :
# fixed_dates:
#   BTCUSD_1h: { train: ["2023-01-01", "2024-01-01"), val: ["2024-01-01", "2024-04-01"), holdout: ["2024-04-01", "2024-07-01") }
#   ETHUSD_1h: { ... }
fixed_dates: {}

# --- Validation ---
# Vérifie que train ∪ val ∪ holdout couvre l'historique disponible sans trou.
validation:
  require_complete_coverage: true
  require_no_gaps: true
  require_min_train_bougies: 1000
  require_min_val_bougies: 200
  require_min_holdout_bougies: 200
