# costs.yaml — Coûts simulés par trade (réalistes, par venue)
# Source : fees_ctrader.json (broker cTrader) — adaptez selon votre venue.

# --- Coûts par défaut (cTrader / forex / crypto standard) ---
# Note : les coûts sont appliqués à l'entrée ET à la sortie (round-trip).
default:
  spread_pct: 0.0002           # 2 bps (0.02%) — ordre de grandeur cTrader
  commission_pct: 0.0001       # 1 bps (0.01%) — commission round-trip
  slippage_pct: 0.0001         # 1 bps (0.01%) — slippage conservateur

# --- Override par actif / classe ---
# Permet de surcharger les coûts selon la liquidité de l'actif.
overrides:
  # Exemples :
  # BTCUSD:
  #   spread_pct: 0.0001
  #   commission_pct: 0.0001
  #   slippage_pct: 0.0002
  # MAJORS_FOREX:
  #   spread_pct: 0.00005
  #   commission_pct: 0.0000
  #   slippage_pct: 0.00005
  {}

# --- Conventions de calcul ---
convention:
  # Application des coûts : toujours round-trip (entrée + sortie)
  round_trip: true
  # Le PnL net est calculé après déduction : spread + commission + slippage × 2
  # (une fois à l'entrée, une fois à la sortie)
  # Le sizing est en % du capital, pas en lots.
  sizing_mode: percent_of_capital
